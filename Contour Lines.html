<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Lines</title>
<style>
  :root { --bg:#f4f3ef; --panel:#ffffff; --ink:#151515; --mute:#777; --line:#e2e0da; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display:grid; grid-template-columns: 290px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:18px 18px 28px; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.02em; }
  .sub { color:var(--mute); margin:0 0 16px; }
  .drop { border:1.5px dashed #c9c6be; border-radius:10px; padding:14px; text-align:center; cursor:pointer;
    color:var(--mute); transition: background .15s, border-color .15s; margin-bottom:14px; }
  .drop:hover, .drop.over { background:#f7f6f2; border-color:#999; color:var(--ink); }
  .drop b { color:var(--ink); }
  .group { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .group h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:0 0 8px; font-weight:600; }
  .row { margin-bottom:10px; }
  .row label { display:flex; justify-content:space-between; margin-bottom:3px; }
  .row label span:last-child { color:var(--mute); font-variant-numeric: tabular-nums; }
  input[type=range] { width:100%; accent-color:#222; }
  .check { display:flex; align-items:center; gap:8px; margin-bottom:8px; cursor:pointer; }
  .colors { display:flex; gap:12px; }
  .colors label { display:flex; align-items:center; gap:6px; }
  input[type=color] { width:30px; height:24px; border:1px solid var(--line); border-radius:6px; padding:0; background:none; }
  .presets { display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  button { font:inherit; border:1px solid #d5d2ca; background:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; color:var(--ink); }
  button:hover { background:#f3f2ee; }
  button.primary { background:#151515; color:#fff; border-color:#151515; }
  button.primary:hover { background:#333; }
  .exports { display:flex; gap:8px; }
  .exports button { flex:1; }
  .status { color:var(--mute); font-size:12px; min-height:16px; margin-top:8px; }
  main { position:relative; display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden; }
  canvas#out { max-width:100%; max-height:100%; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.08); background:#fff; }
  .thumb { position:absolute; right:18px; bottom:18px; width:120px; border-radius:6px; border:3px solid #fff;
    box-shadow:0 4px 14px rgba(0,0,0,.15); opacity:.95; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height:auto; }
    aside { border-right:none; border-bottom:1px solid var(--line); }
    main { min-height:60vh; padding:14px; }
    .thumb { width:80px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Contour Lines</h1>
    <p class="sub">Turn any photo into displaced line art.</p>

    <div class="drop" id="drop"><b>Choose an image</b><br>or drop / paste one here
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="group">
      <h2>Presets</h2>
      <div class="presets">
        <button data-preset="relief">Relief</button>
        <button data-preset="pen">Ink pen</button>
        <button data-preset="opart">Op-art bands</button>
        <button data-preset="ridge">Ridgeline</button>
      </div>
    </div>

    <div class="group">
      <h2>Lines</h2>
      <div class="row"><label><span>Line count</span><span id="v-count"></span></label><input type="range" id="count" min="20" max="260" value="110"></div>
      <div class="row"><label><span>Displacement</span><span id="v-amp"></span></label><input type="range" id="amp" min="0" max="80" value="22"></div>
      <div class="row"><label><span>Angle</span><span id="v-angle"></span></label><input type="range" id="angle" min="-60" max="60" value="0"></div>
      <div class="row"><label><span>Thin width</span><span id="v-wmin"></span></label><input type="range" id="wmin" min="0.2" max="8" step="0.1" value="1.2"></div>
      <div class="row"><label><span>Thick width (dark areas)</span><span id="v-wmax"></span></label><input type="range" id="wmax" min="0.2" max="14" step="0.1" value="1.8"></div>
    </div>

    <div class="group">
      <h2>Image</h2>
      <div class="row"><label><span>Smoothing</span><span id="v-blur"></span></label><input type="range" id="blur" min="0" max="40" value="8"></div>
      <div class="row"><label><span>Contrast</span><span id="v-contrast"></span></label><input type="range" id="contrast" min="0.3" max="3" step="0.05" value="1.2"></div>
      <label class="check"><input type="checkbox" id="invert"> Invert (light areas rise)</label>
      <label class="check"><input type="checkbox" id="occlude"> Hidden lines (ridgeline look)</label>
    </div>

    <div class="group">
      <h2>Texture</h2>
      <div class="row"><label><span>Wave</span><span id="v-wave"></span></label><input type="range" id="wave" min="0" max="30" value="4"></div>
      <div class="row"><label><span>Wave length</span><span id="v-wlen"></span></label><input type="range" id="wlen" min="40" max="800" value="320"></div>
      <div class="row"><label><span>Hand-drawn wobble</span><span id="v-wobble"></span></label><input type="range" id="wobble" min="0" max="4" step="0.1" value="0.6"></div>
    </div>

    <div class="group">
      <h2>Color</h2>
      <div class="colors">
        <label><input type="color" id="inkc" value="#111111"> Ink</label>
        <label><input type="color" id="paperc" value="#ffffff"> Paper</label>
      </div>
    </div>

    <div class="group">
      <h2>Export</h2>
      <div class="exports">
        <button class="primary" id="png">PNG</button>
        <button id="svg">SVG</button>
      </div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="showThumb" checked> Show original thumbnail</label>
      <div class="status" id="status"></div>
    </div>
  </aside>
  <main>
    <canvas id="out"></canvas>
    <img id="thumb" class="thumb" alt="">
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d');
const ids = ['count','amp','angle','wmin','wmax','blur','contrast','wave','wlen','wobble'];
const MAXSIDE = 1400;
let lum = null, W = 0, H = 0, blurredFor = -1, blurred = null, rawLum = null;
let lastPaths = null;

// ---------- image loading ----------
function loadImageSource(src) {
  const img = new Image();
  img.onload = () => setImage(img);
  img.src = src;
}
function setImage(img) {
  const s = Math.min(1, MAXSIDE / Math.max(img.naturalWidth, img.naturalHeight));
  W = Math.max(50, Math.round(img.naturalWidth * s));
  H = Math.max(50, Math.round(img.naturalHeight * s));
  // scale up small images
  if (Math.max(W, H) < 900) { const k = 900 / Math.max(W, H); W = Math.round(W*k); H = Math.round(H*k); }
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx = c.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0,0,W,H);
  cx.drawImage(img, 0, 0, W, H);
  const d = cx.getImageData(0,0,W,H).data;
  rawLum = new Float32Array(W*H);
  for (let i=0, p=0; i<W*H; i++, p+=4) rawLum[i] = (0.2126*d[p] + 0.7152*d[p+1] + 0.0722*d[p+2]) / 255;
  blurredFor = -1;
  $('thumb').src = c.toDataURL('image/jpeg', 0.7);
  out.width = W; out.height = H;
  schedule();
}
function fileIn(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const r = new FileReader(); r.onload = e => loadImageSource(e.target.result); r.readAsDataURL(f);
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => fileIn(e.target.files[0]);
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
document.addEventListener('drop', e => fileIn(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { fileIn(it.getAsFile()); break; }
});

// ---------- blur (separable box blur x3 ≈ gaussian) ----------
function boxBlur(src, w, h, r) {
  if (r < 1) return src.slice();
  let a = src.slice(), b = new Float32Array(w*h);
  for (let pass=0; pass<3; pass++) {
    for (let y=0; y<h; y++) {            // horizontal
      const o = y*w; let acc = 0;
      for (let x=-r; x<=r; x++) acc += a[o + Math.min(w-1, Math.max(0, x))];
      for (let x=0; x<w; x++) {
        b[o+x] = acc / (2*r+1);
        acc += a[o + Math.min(w-1, x+r+1)] - a[o + Math.max(0, x-r)];
      }
    }
    for (let x=0; x<w; x++) {            // vertical
      let acc = 0;
      for (let y=-r; y<=r; y++) acc += b[Math.min(h-1, Math.max(0, y))*w + x];
      for (let y=0; y<h; y++) {
        a[y*w+x] = acc / (2*r+1);
        acc += b[Math.min(h-1, y+r+1)*w + x] - b[Math.max(0, y-r)*w + x];
      }
    }
  }
  return a;
}
function sample(x, y) {   // bilinear, returns luminance 0..1 (outside → paper)
  x = Math.min(W-1, Math.max(0, x)); y = Math.min(H-1, Math.max(0, y));
  const x0 = x|0, y0 = y|0, x1 = Math.min(W-1, x0+1), y1 = Math.min(H-1, y0+1), fx = x-x0, fy = y-y0;
  const a = blurred[y0*W+x0], b = blurred[y0*W+x1], c = blurred[y1*W+x0], d = blurred[y1*W+x1];
  return (a*(1-fx)+b*fx)*(1-fy) + (c*(1-fx)+d*fx)*fy;
}
// cheap smooth noise for wobble
function noise1(x, seed) {
  return Math.sin(x*0.071 + seed*12.9898) * 0.5 + Math.sin(x*0.153 + seed*4.1414) * 0.3 + Math.sin(x*0.311 + seed*7.77) * 0.2;
}

// ---------- render ----------
let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }

function render() {
  ids.forEach(id => $('v-'+id).textContent = $(id).value + (id==='angle' ? '°' : ''));
  if (!rawLum) return;
  const p = Object.fromEntries(ids.map(id => [id, parseFloat($(id).value)]));
  const invert = $('invert').checked, occlude = $('occlude').checked;
  const ink = $('inkc').value, paper = $('paperc').value;
  const blurR = Math.round(p.blur * Math.max(W,H) / 1000);
  if (blurredFor !== blurR) { blurred = boxBlur(rawLum, W, H, blurR); blurredFor = blurR; }

  const ang = p.angle * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
  const diag = Math.hypot(W, H), cx = W/2, cy = H/2;
  // lines span the rotated frame; spacing based on visible height
  const spacing = H / p.count;
  const n = Math.ceil(diag / spacing) + 2;
  const step = 3;
  const ampPx = p.amp / 100 * spacing * 10;   // displacement scales with spacing
  const wobPx = p.wobble * spacing * 0.08;
  const wavePx = p.wave / 100 * spacing * 10;
  const k = 2*Math.PI / (p.wlen * Math.max(W,H)/1000);

  const paths = [];
  for (let i = 0; i < n; i++) {
    const v0 = -diag/2 + i*spacing;            // offset in rotated frame
    const top = [], halfw = [];
    let any = false;
    for (let u = -diag/2; u <= diag/2 + step; u += step) {
      // base point in canvas coords
      const bx = cx + u*ca - v0*sa, by = cy + u*sa + v0*ca;
      let t = sample(bx, by);
      t = 0.5 + (t - 0.5) * p.contrast;          // contrast around mid grey
      t = Math.min(1, Math.max(0, t));
      const dark = invert ? t : 1 - t;
      const wave = wavePx * Math.sin(u*k + i*0.35) * (0.6 + 0.4*Math.sin(i*0.11));
      const wob = wobPx * noise1(u, i);
      const d = -(dark * ampPx) + wave + wob;    // positive dark → line rises
      const v = v0 + d;
      const x = cx + u*ca - v*sa, y = cy + u*sa + v*ca;
      top.push(x, y);
      halfw.push((p.wmin + (p.wmax - p.wmin) * dark) / 2);
      if (x > -50 && x < W+50 && y > -ampPx-50 && y < H+ampPx+50) any = true;
    }
    if (any) paths.push({ pts: top, hw: halfw });
  }
  lastPaths = { paths, ca, sa, occlude, ink, paper };

  ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
  // normal direction (rotated "down")
  const nx = -sa, ny = ca;
  for (const path of paths) {
    const pts = path.pts, hw = path.hw, m = hw.length;
    if (occlude) {      // paint paper beneath line so it hides lines further up
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      for (let j=1; j<m; j++) ctx.lineTo(pts[2*j], pts[2*j+1]);
      ctx.lineTo(pts[2*(m-1)] + nx*diag, pts[2*(m-1)+1] + ny*diag);
      ctx.lineTo(pts[0] + nx*diag, pts[1] + ny*diag);
      ctx.closePath(); ctx.fillStyle = paper; ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(pts[0] - nx*hw[0], pts[1] - ny*hw[0]);
    for (let j=1; j<m; j++) ctx.lineTo(pts[2*j] - nx*hw[j], pts[2*j+1] - ny*hw[j]);
    for (let j=m-1; j>=0; j--) ctx.lineTo(pts[2*j] + nx*hw[j], pts[2*j+1] + ny*hw[j]);
    ctx.closePath(); ctx.fillStyle = ink; ctx.fill();
  }
}

// ---------- SVG ----------
function buildSVG() {
  const { paths, ca, sa, occlude, ink, paper } = lastPaths;
  const nx = -sa, ny = ca, diag = Math.hypot(W,H);
  const f = v => Math.round(v*10)/10;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">\n`;
  s += `<defs><clipPath id="c"><rect width="${W}" height="${H}"/></clipPath></defs>\n<rect width="${W}" height="${H}" fill="${paper}"/>\n<g clip-path="url(#c)">\n`;
  for (const { pts, hw } of paths) {
    const m = hw.length;
    if (occlude) {
      let d = `M${f(pts[0])} ${f(pts[1])}`;
      for (let j=1; j<m; j++) d += `L${f(pts[2*j])} ${f(pts[2*j+1])}`;
      d += `L${f(pts[2*(m-1)]+nx*diag)} ${f(pts[2*(m-1)+1]+ny*diag)}L${f(pts[0]+nx*diag)} ${f(pts[1]+ny*diag)}Z`;
      s += `<path d="${d}" fill="${paper}"/>\n`;
    }
    let d = `M${f(pts[0]-nx*hw[0])} ${f(pts[1]-ny*hw[0])}`;
    for (let j=1; j<m; j++) d += `L${f(pts[2*j]-nx*hw[j])} ${f(pts[2*j+1]-ny*hw[j])}`;
    for (let j=m-1; j>=0; j--) d += `L${f(pts[2*j]+nx*hw[j])} ${f(pts[2*j+1]+ny*hw[j])}`;
    s += `<path d="${d}Z" fill="${ink}"/>\n`;
  }
  return s + '</g>\n</svg>';
}

// ---------- export ----------
let downloads = null;
if (window.claude && claude.use) claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
function status(t) { $('status').textContent = t; if (t) setTimeout(() => { if ($('status').textContent === t) $('status').textContent = ''; }, 4000); }
async function save(filename, blob) {
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); status('Saved ' + filename); }
    catch (e) { status(e && e.code === 'declined' ? 'Save cancelled' : 'Could not save (' + (e && e.code || 'error') + ')'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('png').onclick = () => { if (rawLum) out.toBlob(b => save('contour-lines.png', b), 'image/png'); };
$('svg').onclick = () => { if (lastPaths) save('contour-lines.svg', new Blob([buildSVG()], { type: 'image/svg+xml' })); };

// ---------- presets ----------
const PRESETS = {
  relief: { count:110, amp:22, angle:0, wmin:1.2, wmax:1.8, blur:8, contrast:1.2, wave:4, wlen:320, wobble:0.6, invert:false, occlude:false },
  pen:    { count:140, amp:30, angle:0, wmin:0.9, wmax:1.3, blur:14, contrast:1.0, wave:10, wlen:420, wobble:1.6, invert:false, occlude:false },
  opart:  { count:60, amp:26, angle:-14, wmin:3, wmax:9, blur:10, contrast:1.4, wave:14, wlen:260, wobble:0, invert:false, occlude:false },
  ridge:  { count:70, amp:55, angle:0, wmin:1.4, wmax:2, blur:6, contrast:1.3, wave:0, wlen:320, wobble:0.4, invert:false, occlude:true },
};
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const pr = PRESETS[b.dataset.preset];
  ids.forEach(id => $(id).value = pr[id]);
  $('invert').checked = pr.invert; $('occlude').checked = pr.occlude;
  schedule();
});

ids.forEach(id => $(id).addEventListener('input', schedule));
['invert','occlude','inkc','paperc'].forEach(id => $(id).addEventListener('input', schedule));
$('showThumb').onchange = e => $('thumb').style.display = e.target.checked ? '' : 'none';

// ---------- demo image so the page isn't empty ----------
(function demo() {
  const c = document.createElement('canvas'); c.width = 900; c.height = 1100;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,900,1100);
  const blob = (x,y,r,a) => { const gr = g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(0,0,0,${a})`); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0,0,900,1100); };
  blob(450, 520, 330, 0.85); blob(300, 330, 200, 0.5); blob(640, 760, 240, 0.55); blob(200, 900, 180, 0.35); blob(720, 250, 150, 0.3);
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(470, 540, 90, 140, 0.4, 0, Math.PI*2); g.fill();
  loadImageSource(c.toDataURL());
})();
</script>
</body>
</html>
